<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ezee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">


<style>
.chapName_container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 190px));
  gap: 10px;
  justify-content: center;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  margin: 0;
  padding: 10px;
  padding-bottom: 30px;
}
/* Force minimum 2 columns on small screens */
@media (max-width: 480px) {
  .chapName_container {
    grid-template-columns: repeat(2, minmax(150px, 1fr));
  }
}

/* Confirmation container */
.chapName_conform_container {
  position: fixed;
  bottom: 80px; /* distance above the bottom edge */
  left: 50%;
  transform: translateX(-50%);
  display: none; /* hidden initially */
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
}
/* Button styles */
.chapName_conform_container button {
  background: #ffc01d;
  color: black;
  font-family: "Poppins", sans-serif;
  border: none;
  font-size: 17px;
  padding: 10px 20px;
  border-radius: 10px;
  cursor: pointer;
  position: relative;
}
.chapName_conform_container button:hover {
  background: #c6eace;
}

/* Spinner inside button */
.chapName_spinner {
  border: 2px solid black;
  border-top: 2px solid transparent;
  border-radius: 50%;
  width: 14px;
  height: 14px;
  animation: spin 1s linear infinite;
  display: inline-block;
  vertical-align: middle;
  margin-left: 8px;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.chapName_chapter_box {
  display: inline-block;
  background: #fff;
  border-radius: 6px;
  padding: 12px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative;
  cursor: pointer;
}
.chapName_chapter_box:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 14px rgba(0,0,0,0.2);
}
.chapName_chapter_index {
  font-size: 15px;
  color: #0077cc;
  margin-bottom: 6px;
  font-family: Poppins, sans-serif;
}
.chapName_chapter_name {
  font-family: Poppins, sans-serif;
  font-size: 17px;
  font-weight: bold;
  color: #333;
  position: relative;
  padding-left: 10px;
}
.chapName_chapter_name::before {
  content: "";
  position: absolute;
  left: 0;
  width: 3px;
  height: 100%;
  background: red;
}

/* Locked style */
.chapName_locked {
  background: #f9fad2;
}
.chapName_lock_icon {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 16px;
  height: 16px;
  fill: dimgray;
}
.chapName_chapter_time {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 12px;
  color: #0077cc;
  font-family: Poppins, sans-serif;
  background: #eef6ff;
  padding: 2px 6px;
  border-radius: 6px;
}

.chapName_sub_from {
  display: flex;
  justify-content: center;
  background-color: #f4f6f9;
  padding: 0;
  font-family: Poppins, sans-serif;
  font-size: 16px;
}
.chapName_sub_from_text {
  display: inline-block;/* makes box wrap around its content */
  background: #3498db;
  color: white;
  padding: 5px 20px;                  /* space inside the box */
  border-radius: 60px;
  font-family: Poppins, sans-serif;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  margin: 20px;
}
.chapName_spacebox{
  height: 100px;
  background-color: white;
}
  </style>
</head>
<body>
  <section id="class11_physics_chap" class="content-section">
    <div class="chapName_container" data_subject="p11n">
  <div class="chapName_chapter_box" chap_code="note11p1" chap_index="1">
    <div class="chapName_chapter_index">Chapter 1</div>
    <div class="chapName_chapter_name">Units and Measurements</div>
  </div>
  <div class="chapName_chapter_box" chap_code="note11p2" chap_index="2">
    <div class="chapName_chapter_index">Chapter 2</div>
    <div class="chapName_chapter_name">Motion in Straight Line</div>
  </div>
  <div class="chapName_chapter_box" chap_code="note11p3" chap_index="3">
    <div class="chapName_chapter_index">Chapter 3</div>
    <div class="chapName_chapter_name">Motion in a Plane</div>
  </div>
        </div>
  </section>

  <!-- Confirmation box -->
  <div class="chapName_conform_container" id="confirmContainer">
    <button id="sendBtn">Unlock Chapter</button>
  </div>

<script>
  const student_Data = {
    webhook: "https://api.telebotcreator.com/new-webhook?data=gAAAAABpKYYA7OUOmX8SvoFJ0ATdYV0IyMCoEZEwWESVt69fxzsJAYVU7sfxDaCbEpc8d2BvT-JgIGLqStJr6eSr0Ei2yIFJw0kNKHh0MJ-UPXNOHzA6aHXDB0PDn5apKoFdilin5SCJLfQH95zB7Ix6RTgaB41JIVMfpZ5rcE_0Yq3RWCZ5d9IsqA3KlMVP948CDs0KzYLZaxp3d35gNva71GqgQ3wQkg%3D%3D",
    "name": "Ayush",
    classLevel: "Class 11",
    gender: "male",
    id: 1234567890,
    unlocked: {
      "1764689725": [
        "note11p1", "note11p2", "formula11p3",
      ],
      "1764329725": [
        "formula11p4", "formula11p5", "formula11p8", "formula11p10"
      ]
    }
  };
  
  const lockSVG = `
  <svg xmlns="http://www.w3.org/2000/svg" class="chapName_lock_icon" viewBox="0 0 16 16">
    <path fill-rule="evenodd" d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4M4.5 7A1.5 1.5 0 0 0 3 8.5v5A1.5 1.5 0 0 0 4.5 15h7a1.5 1.5 0 0 0 1.5-1.5v-5A1.5 1.5 0 0 0 11.5 7zM8 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3"/>
  </svg>
`;
 const ayuHex = {
  toHex(str) {
    return Array.from(str)
      .map(ch => ch.charCodeAt(0).toString(16).padStart(2, '0'))
      .join('');
  }
};


 const confirmContainer = document.getElementById("confirmContainer");
 const sendBtn = document.getElementById("sendBtn");
 let selectedCode = null;
 let selectedIndex = null;
 // Loop through chapters
document.querySelectorAll(".chapName_chapter_box").forEach(box => {
 const chapName_code = box.getAttribute("chap_code");
 const chap_index = box.getAttribute("chap_index");
 const incript_index = ayuHex.toHex(`chapter${chap_index}`);
 const chap_subject = box.closest(".chapName_container").getAttribute("data_subject"); // 👈

const chap_key = findKeyForCode(chapName_code);

// Define the list of codes that should skip lock/time logic
const specialCodes = ["note11p1", "note11b1"];
if (specialCodes.includes(chapName_code)) {
  // Example: https://c41c.github.io/app/e/class11/p11n/?inc=63686170746
  box.addEventListener("click", () => {
    window.location.href = `https://c41c.github.io/app/e/class11/${chap_subject}/?inc=${incript_index}`;
  });
  return;
}


// Helper: find which key contains this code
function findKeyForCode(chapName_code) {
 for (const [key, codes] of Object.entries(student_Data.unlocked)) {
   if (codes.includes(chapName_code)) {
     return key;
   }
 }
 return null;
}
 
 // Helper: format time difference
 function formatRelativeTime(unixSeconds) {
   const now = Math.floor(Date.now() / 1000); // current UNIX timestamp in seconds
   const keyTime = parseInt(unixSeconds, 10);
   const diff = keyTime - now; // positive = future, negative = past
   
   const absDiff = Math.abs(diff);
   let value, unit;
   
   if (absDiff < 3600) {
     value = Math.floor(absDiff / 60);
     unit = "H"; // minutes → show as hours if you prefer
     if (value === 0) value = 1; // minimum 1
   } else if (absDiff < 86400) {
     value = Math.floor(absDiff / 3600);
     unit = "H";
   } else {
     value = Math.floor(absDiff / 86400);
     unit = "D";
   }
   
   if (diff >= 0) {
     // Future → remaining
     return `${value} ${unit}`;
   } else {
     // Past → elapsed
     return `${value} ${unit} ago`;
   }
 }


   if (!chap_key) {
     // No key → locked
     box.classList.add("chapName_locked");
     box.insertAdjacentHTML("beforeend", lockSVG);
     
     box.addEventListener("click", () => {
       selectedCode = chapName_code;
       selectedIndex = chap_index;
       sendBtn.textContent = `Unlock Chapter ${chap_index}`;
       confirmContainer.style.display = "flex";
     });
   } else {
     const now = Math.floor(Date.now() / 1000);
     const keyTime = parseInt(chap_key, 10);
     
     if (keyTime < now) {
       // ⛔ Time passed → lock chapter
       box.classList.add("chapName_locked");
       box.insertAdjacentHTML("beforeend", lockSVG);
       
       const relativeTime = formatRelativeTime(chap_key);
       box.insertAdjacentHTML("beforeend", `<div class="chapName_chapter_time">${relativeTime}</div>`);
       
       box.addEventListener("click", () => {
         selectedCode = chapName_code;
         selectedIndex = chap_index;
         sendBtn.textContent = `Unlock Chapter ${chap_index}`;
         confirmContainer.style.display = "flex";
       });
     } else {
       // ✅ Time not passed → unlocked
       const relativeTime = formatRelativeTime(chap_key);
       box.insertAdjacentHTML("beforeend", `<div class="chapName_chapter_time">${relativeTime}</div>`);
       
       box.addEventListener("click", () => {
         /*
         window.location.href = `https://xxxxxvxxvxxx.github.io/letscode/${subject}.html?chapter=chapter${index}`;
         https://c41c.github.io/app/e/class11/p11n/?inc=6368617074657232
         */
         window.location.href = `https://c41c.github.io/app/e/class11/${chap_subject}/?inc=${incript_index}`;
       });
     }
   }
 });
 
 // Send button handler
 sendBtn.addEventListener("click", handleSend);
 
 function handleSend() {
   if (!selectedCode) return;
   sendBtn.innerHTML = `Request sending... <span class="chapName_spinner"></span>`;
   fetch(student_Data.webhook, {
       method: "POST",
       headers: { "Content-Type": "application/json" },
       body: JSON.stringify({ type:'chapter_unlock', chapName_code: selectedCode, info:{name: student_Data.name, id: student_Data.id, class: student_Data.classLevel} })
     })
     .then(() => {
       sendBtn.textContent = "Open Bot and check your inbox.✅️";
       sendBtn.removeEventListener("click", handleSend);
       sendBtn.addEventListener("click", () => {
         confirmContainer.style.display = "none";
       }, { once: true });
     })
     .catch(() => {
       sendBtn.textContent = "Error!";
     });
 }
 
 // Close confirmation box when clicking outside the section
document.addEventListener("click", (event) => {
  const section = document.getElementById("class11_physics_chap");
  const confirmBox = document.getElementById("confirmContainer");

  // If confirm box is visible and click is outside both section and confirm box
  if (
    confirmBox.style.display === "flex" &&
    !section.contains(event.target) &&
    !confirmBox.contains(event.target)
  ) {
    confirmBox.style.display = "none";
    selectedCode = null;
    selectedIndex = null;
  }
});
</script>
</body>
</html>
