<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>EzeeMe Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@200..700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #eeeeee;
      color: #333;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    header {
      background-color: #351757;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      z-index: 1000;
    }

    .weblogo {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
      background-color: #4E277A;
      padding: 8px 16px;
      border-radius: 60px;
      display: inline-block;
      margin-left: 7px;
    }

    main {
      height: auto;
      padding-top: 65px;
      margin-bottom: 3%;
    }

    .imagecontainer {
      margin: 0 auto;
      position: relative;
    }

    .imagecontainer img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .page { 
      position: relative;
      /* Add a class to indicate loading state for initial hidden state if needed */
      min-height: 100vh; /* Ensure some height for observer to work on initially */
    }
    
    /* NEW: Loader element style */
    .loader {
        text-align: center;
        padding: 20px;
        font-size: 1.2em;
        color: #888;
    }

    .watermark-bottom {
      position: absolute;
      bottom: 2%;
      right: 2%;
      color: #f2ba49;
      opacity: 0.50;
      letter-spacing: 2px;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      font-family: "Stack Sans Notch", sans-serif;
      font-weight: 700;
    }

    .watermark-left-center {
      position: absolute;
      top: 50%;
      left: 10px;
      transform: translateY(-50%);
      color: #b0bec5;
      opacity: 0.60;
      letter-spacing: 2px;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      animation: floatY 4s ease-in-out infinite;
      font-family: "Stack Sans Notch", sans-serif;
    }

    @keyframes floatY {
      0%, 100% { transform: translateY(-50%);
      }
      50% { transform: translateY(calc(-50% - 1cm));
      }
    }

    .watermark-vertical-third {
      position: fixed;
      top: 50%;
      transform: translateY(-50%) rotate(90deg);
      color: #888;
      opacity: 0.5;
      letter-spacing: 2px;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      z-index: 2000;
      font-family: "Stack Sans Notch", sans-serif;
      font-weight: 700;
    }

    .width-control {
      margin-left: auto;
      display: flex;
      align-items: center;
      padding-right: 15px;
    }

    #widthRange { margin-left: 8px;
    }

    .watermark-bottom,
    .watermark-left-center,
    .watermark-vertical-third {
      transition: font-size 0.3s ease;
    }

    .space_box{
      height: 10px;
      margin: 0 auto;
      position: relative;
      background-color: #eeeeee;
    }

    @media (orientation: portrait) {
      .imagecontainer { width: 90%;
      }
      .space_box { width: 90%;
      }
    }

    @media (orientation: landscape) {
      .imagecontainer { width: 60%;
      }
      .space_box { width: 60%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="weblogo">
      <span style="color:#A47AD0;">@EzeeMe</span><span style="color:white;">Bot</span>
    </div>

    <div class="width-control">
      <label for="widthRange" style="color:white; margin-left:15px;"></label>
      <input type="range" id="widthRange">
      <span id="widthValue" style="color:white; margin-left:8px;"></span>
    </div>
  </header>

  <main>
    <div class="space_box"></div>
    <div class="imagecontainer" id="images">
      </div>
    <div id="loader" class="loader">Loading more images...</div>
    <div class="watermark-vertical-third" id="fixedWatermark">EzeeMeBot</div>
  </main>

  <script>
    // Decode helper: subtract 3 from each code and rebuild string
    function decodeUrl(arr) {
      return String.fromCharCode(...arr.map(c => c - 3));
    }

    const chapters = {
      'chapter1': [
        [107,119,119,115,118,61,50,50,117,104,118,49,102,111,114,120,103,108,113,100,117,124,49,102,114,112,50,103,101,109,104,108,121,102,121,123,50,108,112,100,106,104,50,120,115,111,114,100,103,50,121,52,58,56,53,60,55,55,52,57,52,50,76,80,74,98,53,51,53,56,51,58,52,60,98,53,53,53,52,54,54,98,113,106,123,104,117,58,49,109,115,106],
        [107,119,119,115,118,61,50,50,117,104,118,49,102,111,114,120,103,108,113,100,117,124,49,102,114,112,50,103,101,109,104,108,121,102,121,123,50,108,112,100,106,104,50,120,115,111,114,100,103,50,121,52,58,56,53,60,55,55,52,56,58,50,76,80,74,98,53,51,53,56,51,58,52,60,98,53,53,53,52,57,57,98,103,110,100,115,123,118,49,109,115,106],
        [107,119,119,115,118,61,50,50,117,104,118,49,102,111,114,120,103,108,113,100,117,124,49,102,114,112,50,103,101,109,104,108,121,102,121,123,50,108,112,100,106,104,50,120,115,111,114,100,103,50,121,52,58,56,53,60,55,55,53,52,57,50,76,80,74,98,53,51,53,56,51,58,52,60,98,53,53,53,52,56,59,98,113,123,109,101,121,54,49,109,115,106],
        [107,119,119,115,118,61,50,50,117,104,118,49,102,111,114,120,103,108,113,100,117,124,49,102,114,112,50,103,101,109,104,108,121,102,121,123,50,108,112,100,106,104,50,120,115,111,114,100,103,50,121,52,58,56,53,60,55,55,53,54,59,50,76,80,74,98,53,51,53,56,51,58,52,60,98,53,53,53,53,52,51,98,112,100,121,120,120,101,49,109,115,106],
        [107,119,119,115,118,61,50,50,117,104,118,49,102,111,114,120,103,108,113,100,117,124,49,102,114,112,50,103,101,109,104,108,121,102,121,123,50,108,112,100,106,104,50,120,115,111,114,100,103,50,121,52,58,56,53,60,55,55,53,56,51,50,76,80,74,98,53,51,53,56,51,58,52,60,98,53,53,53,53,53,55,98,109,115,119,58,112,114,49,109,115,106],
        [107,119,119,115,118,61,50,50,117,104,118,49,102,111,114,120,103,108,113,100,117,124,49,102,114,112,50,103,101,109,104,108,121,102,121,123,50,108,112,100,106,104,50,120,115,111,114,100,103,50,121,52,58,56,53,60,55,55,53,57,56,50,76,80,74,98,53,51,53,56,51,58,52,60,98,53,53,53,53,54,55,98,109,107,104,112,100,118,49,109,115,106],
        [107,119,119,115,118,61,50,50,117,104,118,49,102,111,114,120,103,108,113,100,117,124,49,102,114,112,50,103,101,109,104,108,121,102,121,123,50,108,112,100,106,104,50,120,115,111,114,100,103,50,121,52,58,56,53,60,55,55,53,59,58,50,76,80,74,98,53,51,53,56,51,58,52,60,98,53,53,53,53,55,57,98,113,119,115,103,56,106,49,109,115,106],
        [107,119,119,115,118,61,50,50,117,104,118,49,102,111,114,120,103,108,113,100,117,124,49,102,114,112,50,103,101,109,104,108,121,102,121,123,50,108,112,100,106,104,50,120,115,111,114,100,103,50,121,52,58,56,53,60,55,55,54,51,57,50,76,80,74,98,53,51,53,56,51,58,52,60,98,53,53,53,53,56,59,98,103,118,102,101,124,124,49,109,115,106],
        [107,119,119,115,118,61,50,50,117,104,118,49,102,111,114,120,103,108,113,100,117,124,49,102,114,112,50,103,101,109,104,108,121,102,121,123,50,108,112,100,106,104,50,120,115,111,114,100,103,50,121,52,58,56,53,60,55,55,54,52,58,50,76,80,74,98,53,51,53,56,51,58,52,60,98,53,53,53,54,51,60,98,122,102,109,116,104,117,49,109,115,106],
        [107,119,119,115,118,61,50,50,117,104,118,49,102,111,114,120,103,108,113,100,117,124,49,102,114,112,50,103,101,109,104,108,121,102,121,123,50,108,112,100,106,104,50,120,115,111,114,100,103,50,121,52,58,56,53,60,55,55,54,53,59,50,76,80,74,98,53,51,53,56,51,58,52,60,98,53,53,53,54,53,51,98,101,115,60,116,124,119,49,109,115,106],
        [107,119,119,115,118,61,50,50,117,104,118,49,102,111,114,120,103,108,113,100,117,124,49,102,114,112,50,103,101,109,104,108,121,102,121,123,50,108,112,100,106,104,50,120,115,111,114,100,103,50,121,52,58,56,53,60,55,55,54,54,58,50,76,80,74,98,53,51,53,56,51,58,52,60,98,53,53,53,55,54,57,98,119,122,102,103,118,56,49,109,115,106]
      ],
      'chapter2': []
    };
    
    // NEW: Variables for lazy loading
    const IMAGES_PER_LOAD = 5;
    let imagesLoadedCount = 0;
    let allImages = []; // Array to hold all encoded image data for the current chapter
    let isLoading = false; // Flag to prevent multiple concurrent loads
    let hasMoreImages = true;

    // Hex to string
    function hexToString(hex) {
      let str = '';
      for (let i = 0; i < hex.length; i += 2) {
        str += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
      }
      return str;
    }

    const whereis = new URLSearchParams(window.location.search);
    const incriptedata = whereis.get("inc");
    let chapter = 'chapter1';
    if (incriptedata) {
      try { chapter = hexToString(incriptedata);
      }
      catch(e) { console.error("Hex decode failed:", e);
      }
    }

    const container = document.getElementById('images');
    const loader = document.getElementById('loader');

    // NEW FUNCTION: Creates and appends a single image page
    function createImagePage(encodedArr) {
        const url = decodeUrl(encodedArr);
        const page = document.createElement('div');
        page.className = 'page';

        const img = document.createElement('img');
        img.src = url;

        const watermarkBottom = document.createElement('div');
        watermarkBottom.className = 'watermark-bottom';
        watermarkBottom.textContent = 'EzeeMeBot';

        const watermarkLeftCenter = document.createElement('div');
        watermarkLeftCenter.className = 'watermark-left-center';
        watermarkLeftCenter.textContent = 'EzeeMeBot';

        page.appendChild(img);
        page.appendChild(watermarkBottom);
        page.appendChild(watermarkLeftCenter);
        container.appendChild(page);
    }
    
    // NEW FUNCTION: Loads a batch of images
    function loadNextImages() {
        if (isLoading || !hasMoreImages) return;
        isLoading = true;
        loader.textContent = 'Loading more images...'; // Reset loader text

        const startIndex = imagesLoadedCount;
        const endIndex = startIndex + IMAGES_PER_LOAD;
        const batch = allImages.slice(startIndex, endIndex);

        if (batch.length === 0) {
            hasMoreImages = false;
            observer.unobserve(loader);
            loader.textContent = 'End of chapter.';
            isLoading = false;
            return;
        }

        batch.forEach(encodedArr => {
            createImagePage(encodedArr);
            imagesLoadedCount++;
        });

        isLoading = false;
        
        // Re-observe the loader if there might be more images
        if (imagesLoadedCount < allImages.length) {
            // Unobserve the old target (if any) and observe the loader again.
            // Since the loader is a fixed element, we don't need to unobserve/re-observe,
            // but we must call `positionVerticalWatermark()` because new content may change scroll height.
            positionVerticalWatermark(); 
        } else {
            hasMoreImages = false;
            observer.unobserve(loader);
            loader.textContent = 'End of chapter.';
        }
        
        // Important: Re-apply widths and watermarks after adding new images
        applyWidth(); 
    }

    // Initialize allImages array and start observer
    if (chapters[chapter]) {
        allImages = chapters[chapter];
        loadNextImages(); // Load first 5 images on page load
    } else {
        hasMoreImages = false;
        loader.textContent = 'No content found for this chapter.';
    }

    // NEW: Intersection Observer setup
    const observerOptions = {
      root: null, // viewport
      rootMargin: '200px', // start loading when the loader is 200px away
      threshold: 0.0
    };

    const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting && hasMoreImages && !isLoading) {
                // The loader is visible, load the next batch
                loadNextImages();
            }
        });
    }, observerOptions);

    // Start observing the loader element
    if (hasMoreImages) {
        observer.observe(loader);
    }
    // END NEW LAZY LOADING LOGIC

    // Prevent right-click and drag
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('dragstart', event => event.preventDefault());

    function resizeWatermarks() {
      const container = document.querySelector('.space_box');
      if (!container) return;
      const containerWidth = container.offsetWidth;
      const fontSize = containerWidth * 0.05;
      const fontSize2 = containerWidth * 0.03;
      document.querySelectorAll('.watermark-vertical-third').forEach(wm => {
        wm.style.fontSize = fontSize + 'px';
      });
      document.querySelectorAll('.watermark-bottom').forEach(wm => {
        wm.style.fontSize = fontSize2 + 'px';
      });
      document.querySelectorAll('.watermark-left-center').forEach(wm => {
        wm.style.fontSize = fontSize2 + 'px';
      });
    }

    function positionVerticalWatermark() {
      const container = document.querySelector('.space_box');
      const wm = document.getElementById('fixedWatermark');
      if (!container || !wm) return;
      const rect = container.getBoundingClientRect();
      // The vertical watermark position logic remains the same
      const leftPos = rect.left + rect.width * 0.67; 
      wm.style.left = leftPos + 'px';
    }

    // Slider setup: orientation-specific ranges and robust detection
    const widthRange = document.getElementById('widthRange');
    const widthValue = document.getElementById('widthValue');
    const imageContainer = document.querySelector('.imagecontainer');

    const limits = {
      portrait:  { min: 80, max: 95, def: 90 },
      landscape: { min: 55, max: 95, def: 65 }
    };

    // Determine orientation reliably:
    // 1) Prefer screen.orientation if available
    // 2) Fallback to viewport comparison
    function getOrientation() {
      const so = (screen.orientation && screen.orientation.type) ||
      screen.msOrientation || screen.mozOrientation || screen.webkitOrientation;
      if (typeof so === 'string') {
        return so.includes('portrait') ?
        'portrait' : 'landscape';
      }
      // iOS Safari fallback: compare dimensions
      return window.innerHeight >= window.innerWidth ?
      'portrait' : 'landscape';
    }

    let currentOrientation = getOrientation();

    function applyWidth() {
      const val = Number(widthRange.value);
      if (Number.isNaN(val)) return;
      imageContainer.style.width = val + '%';
      document.querySelector('.space_box').style.width = val + '%';
      widthValue.textContent = val + '%';
      resizeWatermarks();
      positionVerticalWatermark();
    }

    function setRangeLimitsAndDefault(mode, { forceDefault = false } = {}) {
      const { min, max, def } = limits[mode];
      // Set limits
      widthRange.min = String(min);
      widthRange.max = String(max);
      // Choose value
      const current = Number(widthRange.value);
      let nextVal;
      if (forceDefault || Number.isNaN(current) || widthRange.value === '') {
        nextVal = def;
      // explicit default
      } else {
        nextVal = Math.min(max, Math.max(min, current));
      // clamp
      }

      widthRange.value = String(nextVal);
      applyWidth();
    }

    // Debounced orientation handler for resize thrash
    let resizeTimer = null;

    function onPossibleOrientationChange({ forceDefault = false } = {}) {
      const newOrientation = getOrientation();
      if (newOrientation !== currentOrientation) {
        currentOrientation = newOrientation;
        setRangeLimitsAndDefault(currentOrientation, { forceDefault });
      }
    }

    // Initial load: enforce defaults first, then layout adjustments
    window.addEventListener('DOMContentLoaded', () => {
      currentOrientation = getOrientation();
      setRangeLimitsAndDefault(currentOrientation, { forceDefault: true });
      resizeWatermarks();
      positionVerticalWatermark();
    });

    // screen.orientation change (modern Android/Chrome)
    if (screen.orientation && typeof screen.orientation.addEventListener === 'function') {
      screen.orientation.addEventListener('change', () => {
        onPossibleOrientationChange({ forceDefault: true });
      });
    } else if (screen.orientation && 'onchange' in screen.orientation) {
      screen.orientation.onchange = () => onPossibleOrientationChange({ forceDefault: true });
    }

    // Window orientationchange (older mobile browsers)
    window.addEventListener('orientationchange', () => {
      onPossibleOrientationChange({ forceDefault: true });
    });

    // Resize fallback (iOS Safari often only fires resize)
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => onPossibleOrientationChange({ forceDefault: true }), 120);
      // Keep watermarks responsive even when orientation doesn't change
      resizeWatermarks();
      positionVerticalWatermark();
    });

    // Slider interaction
    widthRange.addEventListener('input', applyWidth);
  </script>
</body>
