<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Overlay Example</title>
  <style>
    .img-container {
      position: relative;
      width: 400px; /* adjust as needed */
    }
    .img-container img {
      width: 100%;
      display: block;
    }
    .img-container .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain; /* keeps aspect ratio */
      pointer-events: none; /* overlay won’t block clicks */
    }
  </style>
</head>
<body>
  <div class="img-container">
    <img src="https://res.cloudinary.com/dgf9ntio0/image/upload/v1765708298/kmc_20251214_155903_xfd8lt.png" alt="Base Image">
    <img class="overlay" src="https://res.cloudinary.com/durzipdbq/image/upload/v1765891255/noughty_iyzt9l.jpg" alt="Overlay Image">
  </div>
</body>
</html>
