<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Layer Example</title>
  <style>
    .image-stack {
      position: relative;
      display: inline-block;
      margin: 20px;
    }

    /* Visible image (background layer) */
    .image-stack .visible {
      display: block;
      width: 400px;
      height: auto;
      user-select: none;
      pointer-events: none; /* prevent direct interaction */
    }

    /* Hidden image overlay (invisible but selectable) */
    .image-stack .hidden {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;              /* invisible */
      pointer-events: auto;    /* intercept clicks/selections */
    }
  </style>
</head>
<body>
  <div class="image-stack">
    <!-- Visible image -->
    <img class="visible"
         src="https://res.cloudinary.com/dqg4lukez/image/upload/v1761231179/samples/coffee.jpg"
         alt="Coffee">

    <!-- Hidden image (invisible but selectable) -->
    <img class="hidden"
         src="https://res.cloudinary.com/dqg4lukez/image/upload/v1761231178/samples/outdoor-woman.jpg"
         alt="Outdoor Woman">
  </div>
</body>
</html>
