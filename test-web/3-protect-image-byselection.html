<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Protected Images</title>
  <style>
    .image-protect {
      position: relative;
      display: inline-block;
      margin: 20px;
    }

    .image-protect img {
      display: block;
      width: 400px; /* adjust size as needed */
      height: auto;
      user-select: none;       /* prevent text/image selection */
      pointer-events: none;    /* block direct interaction */
    }

    .image-protect::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: transparent; /* invisible overlay */
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="image-protect">
    <img src="https://res.cloudinary.com/dqg4lukez/image/upload/v1761231178/samples/outdoor-woman.jpg" alt="Outdoor Woman">
  </div>

  <div class="image-protect">
    <img src="https://res.cloudinary.com/dqg4lukez/image/upload/v1761231179/samples/coffee.jpg" alt="Coffee">
  </div>
</body>
</html>
