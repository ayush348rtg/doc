<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Protected Images with Transparent SVG</title>
  <style>
    .image-protect {
      position: relative;
      display: inline-block;
      margin: 20px;
    }

    .image-protect img {
      display: block;
      width: 400px; /* adjust size as needed */
      height: auto;
      user-select: none;       /* prevent selection */
      pointer-events: none;    /* block direct interaction */
    }

    .overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: default;
    }
  </style>
</head>
<body>
  <!-- First image -->
  <div class="image-protect">
    <img src="https://res.cloudinary.com/dqg4lukez/image/upload/v1761231178/samples/outdoor-woman.jpg" alt="Outdoor Woman" draggable="false">
    <svg class="overlay" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect x="0" y="0" width="100" height="100" fill="none" pointer-events="all"/>
    </svg>
  </div>

  <!-- Second image -->
  <div class="image-protect">
    <img src="https://res.cloudinary.com/dqg4lukez/image/upload/v1761231179/samples/coffee.jpg" alt="Coffee" draggable="false">
    <svg class="overlay" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect x="0" y="0" width="100" height="100" fill="none" pointer-events="all"/>
    </svg>
  </div>
</body>
</html>
