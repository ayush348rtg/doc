<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirect Example</title>
</head>
<body>
  <h1>Welcome to My Page</h1>
  <p>Click the button below to redirect using <code>window.location.replace()</code>.</p>

  <button onclick="redirect()">Go to New Page</button>

  <script>
    function redirect() {
      // This will replace the current page in history
      window.location.replace("https://example.com");
    }
  </script>
</body>
</html>
