<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirect with Query Data</title>
</head>
<body>
  <h1>Redirect with Query Parameters</h1>
  <p>Click a button to redirect, carrying over the query string.</p>

  <!-- Button 1 -->
  <button onclick="redirectWithQuery('https://example.com')">
    Go to Example.com
  </button>

  <!-- Button 2 -->
  <button onclick="redirectWithQuery('https://c41c.github.io')">
    Go to My GitHub Page
  </button>

  <script>
    function redirectWithQuery(baseUrl) {
      // Get the query string from the current page (everything after ?)
      const queryString = window.location.search; 
      
      // Append it to the new URL
      const newUrl = baseUrl + queryString;

      // Redirect, replacing history so Back won't return here
      window.location.replace(newUrl);
    }
  </script>
</body>
</html>
